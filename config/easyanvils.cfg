# Configuration file

client {
    # Render inventory contents of an anvil. [default: true]
    B:renderAnvilContents=true
}


costs {
    # Multiplier for each level of a common enchantment being applied. [range: 0 ~ 2147483647, default: 1]
    I:commonEnchantmentMultiplier=1

    # Master toggle for free renaming. When disabled, renaming items in an anvil always costs a level (vanilla behaviour). [default: true]
    B:enableFreeRenames=true

    # Master toggle for the 'Too Expensive!' cost cap. When disabled, anvil operations are never blocked for costing too much (no upper level limit).
    # Leave disabled if another mod (e.g. EnchantmentControl) manages this, since the prior work penalty can otherwise make costs interact oddly. [default: false]
    B:enableTooExpensiveLimit=false

    # Which items rename for free when 'enableFreeRenames' is true. ALL_ITEMS: every item. NAME_TAGS_ONLY: only name tags. [default: ALL_ITEMS]
    S:freeRenames=ALL_ITEMS

    # Costs for applying enchantments from enchanted books are halved. [default: true]
    B:halvedBookCosts=true

    # Multiplier for each level of a rare enchantment being applied. [range: 1 ~ 2147483647, default: 4]
    I:rareEnchantmentMultiplier=4

    # The additional cost in levels for each valid repair material an item is repaired with in an anvil. [range: 0 ~ 2147483647, default: 1]
    I:repairWithMaterialUnitCost=1

    # The additional cost in levels for combining an item with another item of the same kind when the first item is not fully repaired. [range: 0 ~ 2147483647, default: 2]
    I:repairWithOtherItemCost=2

    # Max cost in enchantment levels allowed in an anvil when 'enableTooExpensiveLimit' is true. Every operation exceeding the limit shows as 'Too Expensive!' and is disallowed.
    # Set to '40' enchantment levels in vanilla. [range: 0 ~ 2147483647, default: 40]
    I:tooExpensiveLimit=40

    # Multiplier for each level of a uncommon enchantment being applied. [range: 1 ~ 2147483647, default: 2]
    I:uncommonEnchantmentMultiplier=2

    # Multiplier for each level of a very rare enchantment being applied. [range: 1 ~ 2147483647, default: 8]
    I:veryRareEnchantmentMultiplier=8
}


miscellaneous {
    # Allow normally mutually-exclusive enchantments to coexist on the same item via the anvil.
    # e.g. Sharpness + Smite + Bane of Arthropods on a weapon, or every Protection on one piece of armor. [default: false]
    B:allowIncompatibleEnchantments=false

    # Chance per use the anvil degrades one stage (intact -> chipped -> damaged -> destroyed) when 'anvilsCanBreak' is true. Vanilla is 0.12.
    D:anvilBreakChance=0.12

    # Allow using iron blocks to repair an anvil by one damage stage. Can be automated using dispensers. [default: true]
    B:anvilRepairing=true

    # Master toggle for anvil damage. When disabled, anvils never chip, damage, or break from use (indestructible). [default: true]
    B:anvilsCanBreak=true

    # Edit name tags without cost nor anvil, simply by sneak + right-clicking. [default: true]
    B:editNameTagsNoAnvil=true

    # The naming field in anvils and the name tag gui will support formatting codes for setting custom text colors and styles.
    # Use the section sign or the ampersand (&) followed by a formatting code. [default: true]
    B:renamingSupportsFormatting=true

    # Solely renaming items in an anvil will never cause the anvil to break. [default: true]
    B:riskFreeAnvilRenaming=true
}


prior_work_penalty {
    # Master toggle for the prior work penalty. When disabled, working an item multiple times never raises future costs (equivalent to priorWorkPenalty=DISABLED). [default: true]
    B:enablePriorWorkPenalty=true

    # Prevents the prior work penalty from increasing when the item has only been renamed or repaired. [default: true]
    B:penaltyFreeRenamesAndRepairs=true

    # Controls how working an item in the anvil multiple times affects the cost of future operations.
    # FIXED: A constant value is added every time the item is worked.
    # VANILLA: Penalty doubles every time an item is worked.
    # DISABLED: Penalty stays at 0 and does not increase. [default: FIXED]
    S:priorWorkPenalty=FIXED

    # Constant to use when "priorWorkPenalty" is set to "FIXED". Every subsequent operation will increase by this value in levels. [range: 1 ~ 2147483647, default: 4]
    I:priorWorkPenaltyConstant=4

    # FIXED: When renaming / repairing, ignore any prior work penalty on the item. Makes prior work penalty only relevant when new enchantments are added.
    # LIMITED: When renaming / repairing cost exceeds max anvil repair cost, limit cost just below max cost.
    # VANILLA: Renaming / repairing increase with prior work penalty and will no longer be possible when max cost is exceeded. [default: FIXED]
    S:renameAndRepairCosts=FIXED
}


