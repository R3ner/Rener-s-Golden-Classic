# Configuration file

general {
    # amount of leaves spawning from conifer trees
    # Min: 0
    # Max: 2147483647
    I:coniferLeafSpawnRate=2

    # disable wind effects
    B:disableWind=false

    # whether player-placed blocks should also drop leaves
    B:dropFromPlayerPlacedBlocks=true

    # modifies how long it takes for the leaves to disappear
    # Values over 2000 are not recommended
    # Min: 100
    # Max: 2147483647
    I:leafLifespan=200

    # modifies the size of the leaves
    # Min: 1
    # Max: 20
    I:leafSize=5

    # modifies the amount of leaves spawning
    # Min: 0
    # Max: 2147483647
    I:leafSpawnRate=20

    # free space below a leaf block needed for leaves to spawn
    # Min: 1
    # Max: 20
    I:minimumFreeSpaceBelow=1

    # per-season leaf spawn-rate multiplier, used only when Serene Seasons is installed
    # order is [spring, summer, autumn, winter] - e.g. more leaves fall in autumn, fewer in winter
    D:seasonFallRate <
        1.0
        1.0
        3.0
        0.25
     >

    # show a one-time in-game notice when another mod that also adds leaf particles is detected
    B:showCompatWarning=true

    # windless dimensions (by dimension name, e.g. 'the_nether', 'the_end')
    S:windlessDimension <
        the_nether
        the_end
     >
}


