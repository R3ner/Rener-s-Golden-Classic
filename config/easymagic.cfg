# Configuration file

client {
    # Reroll button X offset from the left edge of the enchanting GUI (negative = left of GUI, positive = inside/right) [range: -200 ~ 200, default: -42]
    I:rerollButtonOffsetX=-42

    # Reroll button Y offset from the top edge of the enchanting GUI [range: -200 ~ 200, default: 11]
    I:rerollButtonOffsetY=11
}


general {
    # How many enchantments to preview in the tooltip (-1 = show all, 1 = vanilla behavior) [range: -1 ~ 20, default: -1]
    I:enchantmentHintCount=-1

    # Items stay in the enchanting table when the GUI is closed [default: true]
    B:keepItemsInTable=true

    # Number of bookshelves required for maximum level enchantments [range: 0 ~ 15, default: 15]
    I:maxBookshelfCount=15

    # Enable the reroll button in the enchanting GUI [default: true]
    B:rerollEnabled=true

    # Lapis lazuli required to reroll enchantments (0 = free) [range: 0 ~ 64, default: 1]
    I:rerollLapisCost=1

    # XP points (not levels) required to reroll enchantments (0 = free) [range: 0 ~ 1000, default: 5]
    I:rerollXpCost=5

    # Show enchantment name hints in the enchanting GUI [default: true]
    B:showEnchantmentHints=true
}


